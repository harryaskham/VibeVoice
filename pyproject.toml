[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice"
version = "0.0.1"
authors = [
  { name="vibevoice team", email="vibepod@microsoft.com" },
]
description = "A model for speech generation with an AR + diffusion architecture."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch==2.6.0",
    "accelerate==1.6.0",
    "transformers==4.51.3", # we develop this project on transformers==4.51.3, later version may not be compatible
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
    "diffusers",
    "tqdm",
    "numpy",
    "scipy",
    "librosa",
    "ml-collections",
    "absl-py",
    "gradio",
    "av",
    "aiortc",
    "triton==3.2.0",
    #"pytorch-triton-rocm==3.2.0",
    "ninja",
    "packaging",
    "flash-attn",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true}]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2.4"
explicit = true

# env | rg "(HIP|HCC|HSA|GPUS|ROCM|FLASH)"
[tool.uv.extra-build-variables]
flash-attn = {HCC_AMDGPU_TARGET = "gfx1100", HIP_VISIBLE_DEVICES = "0,1", HSA_OVERRIDE_GFX_VERSION = "11.0.0", GPUS_ARCH = "gfx1100", PYTORCH_ROCM_ARCH = "gfx1100", FLASH_ATT_V2_COMMIT_ROCM = "2554f490101742ccdc56620a938f847f61754be6", FLASH_ATTENTION_TRITON_AMD_ENABLE = "TRUE", FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
triton = [{ index = "pytorch-rocm" }]

[project.urls]
"Homepage" = "https://github.com/microsoft/VibeVoice"
"Bug Tracker" = "https://github.com/microsoft/VibeVoice/issues"

[tool.setuptools.packages.find]
where = ["."]
